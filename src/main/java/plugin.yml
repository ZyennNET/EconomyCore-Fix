    description: Allow using /smithingtable
    default: true
  economysmpcore.whereami:
    description: Allow using /whereami
    default: true
  economysmpcore.tab.admin:
    description: Manage TAB list
    default: op

  # Sell system permissions
  economysmpcore.sell.history:
    description: Allow using /sellhistory
    default: true
  economysmpcore.sell.multi:
    description: Allow using /sellmulti
    default: true

  # Mute system permissions
  economysmpcore.mute:
    description: Allows using /mute
