# ──────────────────────────────────────────────────────────────
#  DonutTeam configuration 
#  Supports & colour codes in all name/lore/title fields.
# ──────────────────────────────────────────────────────────────
donutteam:

  # Misc
  show-pvp-disabled-message: false

  # Placeholder - value shown when player has no team
  placeholder:
    no-team: "N/A"

  # Messages
  messages:
    left-team: "&7You left the team."
    member-left: "&7%player% left the team."
    team-deleted: "&aTeam deleted!"
    team-disbanded: "&cYour team has been disbanded!"
    cancelled: "&7Action cancelled."
    name-too-short: "&cTeam name must be at least &f%min% &ccharacters."
    name-too-long: "&cTeam name must be at most &f%max% &ccharacters."
    name-restricted: "&cThat team name is not allowed."
    config-reloaded: "&aTeam config reloaded."

  # ── Team name rules ────────────────────────────────────────
  name:
    min-length: 3
    max-length: 16
    restricted:
      - "admin"
      - "staff"
      - "owner"
      - "mod"
      - "donut"
      - "server"

  # ── Team GUI (main /team GUI) ──────────────────────────────
  gui:
    team-title: "&8ᴛᴇᴀᴍ &7(Page %page%)"
    perms-title: "&8ᴇᴅɪᴛ ᴘᴇʀᴍɪssɪᴏɴs"
    sort-name: "&asᴏʀᴛ"
    prev-name: "&aʙᴀᴄᴋ"
    prev-lore:
      - "&fPrevious page"
    next-name: "&aɴᴇxᴛ"
    next-lore:
      - "&fNext page"
    home-name: "&aᴛᴇᴀᴍ ʜᴏᴍᴇ"
    home-lore:
      - "&fClick to teleport to team home"
    search-name: "&asᴇᴀʀᴄʜ"
    pvp-name: "&aᴘᴠᴘ"
    refresh-name: "&aᴛᴇᴀᴍ %team%"

  # ── Confirm GUI (leave / delete) ───────────────────────────
  confirm-gui:
    # Titles
    leave-title: "&8ᴄᴏɴꜰɪʀᴍ ʟᴇᴀᴠᴇ"
    delete-title: "&8ᴄᴏɴꜰɪʀᴍ ᴅɪsʙᴀɴᴅ"

    # Cancel button (slot 11, red glass)
    cancel-name: "&cᴄᴀɴᴄᴇʟ"
    cancel-lore:
      - "&7Click to cancel"

    # Confirm leave button (slot 15, lime glass)
    confirm-leave-name: "&aᴄᴏɴꜰɪʀᴍ ʟᴇᴀᴠᴇ"
    confirm-leave-lore:
      - "&7Click to leave your team"

    # Confirm delete/disband button (slot 15, lime glass)
    confirm-delete-name: "&aᴄᴏɴꜰɪʀᴍ ᴅɪsʙᴀɴᴅ"
    confirm-delete-lore:
      - "&7Click to disband your team"

# ANNOUNCEMENT 

announce:
  title-prefix: "&d&l"
  title-label: "announcements"
  use-small-caps: true
  title-times:
    fade-in: 10    # ticks (10 = 0.5s)
    stay: 70       # ticks (70 = 3.5s)
    fade-out: 20   # ticks (20 = 1s)
  sound:
    enabled: true
    type: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

discord:
  - "&fJoin our discord: &ahttps://discord.gg/fmc"

input-method: chat   # options: chat, sign

# Disable a feature set to true to enable or false to disable

modules:
  spawn-system: true
  spawners-system: true
  toggle-system: true
  report-system: true
  chainmail-system: false
  teleport-system: true
  old-spawn-system: true
  sell-system: true
  team-system: true
  chathover-system: false
  donutworth-system: true
  tablist-system: false

  # Set any of these to false to disable that command/feature entirely.
  # Disabling one frees up its command name so another plugin can use it
  # instead (e.g. set media-system to false to use a different /media plugin).
  media-system: true
  pay-system: true
  worth-system: true
  home-system: true
  warp-system: true
  shop-system: true
  bounty-system: true
  duel-system: true
  afk-system: true
  tools-system: true