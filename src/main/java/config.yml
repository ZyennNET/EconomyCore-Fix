# ==================== DonutSpawn Settings ====================
# Teleport delay in seconds (set to 0 to disable)
spawn-delay: 5

# Cancel teleport if player moves during countdown
cancel-on-move: true

# Open the spawn GUI when using /spawn (if false, teleport to default spawn)
spawn-gui: true

# Default spawn point name (used when GUI is disabled or no name given)
default-spawn: "spawn1"

# Teleport to spawn on respawn (immediately sets respawn location)
teleport-on-respawn: true

# Teleport to spawn after death with a short delay (1 tick)
teleport-on-death: true

# First‑join teleport (teleports new players to a spawn)
first-join:
  enabled: true
  spawn-name: "spawn1"

# Join teleport (teleports all players on every join – disable if you don't want this)
join:
  enable: false
  spawn-name: "spawn1"

# Optional: custom sound mapping (you can change the sound names)
Sounds:
  teleport-cooldown: "block.note_block.pling"
  teleport-complete: "entity.enderman.teleport"
  teleport-cancel: "entity.villager.no"
  no-permission: "entity.villager.no"
  reload-success: "entity.player.levelup"
  click-sound: "ui.button.click"

# Worth lore settings (DonutWorth module)
