# Profile viewer settings
profile:
  gui-title: "ᴘʀᴏғɪʟᴇ ᴍᴀɴᴀɢᴇʀ "
  gui-size: 54
  items:
    - slot: 11
      material: PLAYER_HEAD
      name: "&b&l{username} Profile"
      lore:
        - "&fMoney: &a$ %donutcore_balance%"
        - "&fShards: &5⭐ %donutcore_shards%"
        - "&fPlaytime &6⌚ %donutcore_playtime%"
      action: NONE
    - slot: 13
      material: NETHERITE_SWORD
      name: "&b&l{username} PvP Stats"
      lore:
        - "&c🗡️ &fKills: &c%donutcore_kills%"
        - "&6☠️ &fDeaths: &6%donutcore_deaths%"
      action: NONE
    - slot: 15
      material: GRASS_BLOCK
      name: "&b&l{username} Building Stats"
      lore:
        - "&fBlocks placed: %donutcore_blocks_placed%"
        - "&fMobs killed: %donutcore_mobs_killed%"
      action: NONE
    - slot: 29
      material: LIGHT_BLUE_BED
      name: "&bʜᴏᴍᴇ #1"
      lore:
        - "&fClick to teleport to {username}'s home 1"
      action: HOME
      home-index: 1
    - slot: 30
      material: LIGHT_BLUE_BED
      name: "&bʜᴏᴍᴇ #2"
      lore:
        - "&fClick to teleport to {username}'s home 2"
      action: HOME
      home-index: 2
    - slot: 31
      material: LIGHT_BLUE_BED
      name: "&bʜᴏᴍᴇ #3"
      lore:
        - "&fClick to teleport to {username}'s home 3"
      action: HOME
      home-index: 3
    - slot: 32
      material: LIGHT_BLUE_BED
      name: "&bʜᴏᴍᴇ #4"
      lore:
        - "&fClick to teleport to {username}'s home 4"
      action: HOME
      home-index: 4
    - slot: 33
      material: LIGHT_BLUE_BED
      name: "&bʜᴏᴍᴇ #5"
      lore:
        - "&fClick to teleport to {username}'s home 5"
      action: HOME
